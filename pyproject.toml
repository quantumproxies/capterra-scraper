[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-capterra-scraper"
version = "0.1.0"
description = "Capterra scraper for Python and the command line: the software products of a Capterra category with vendor, star rating, rating breakdown, sub-scores, review counts, starting price, free trial and paid-placement flag, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["capterra-scraper", "capterra", "capterra-api", "software-directory", "saas", "software-ratings", "market-research", "competitive-intelligence", "b2b-data", "web-scraping", "scraper", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
capterra-scraper = "quanticdata_capterra_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/capterra-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=capterra-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/capterra-scraper"
Issues = "https://github.com/quantumproxies/capterra-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_capterra_scraper" = ["spec.json", "py.typed"]
